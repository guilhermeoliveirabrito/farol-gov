name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github .
      # o app.js nao tem build, entao pelo menos garante que ele faz parse
      - run: node --check site/app.js

  # monta o site com os dados do repo e abre num chromium de verdade
  pagina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest e2e -v

  # roda contra um dominio de verdade so pra ver se o caminho real (dnspython, ssl) funciona.
  # nao bloqueia o merge porque depende de rede externa
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: farol check www.gov.br
      - run: farol check www.recife.pe.gov.br --json
