name: pagina

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      artefato:
        description: "Nome do artifact com o latest.json (quando chamado pela varredura)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pegar resultados da varredura
        if: ${{ inputs.artefato }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artefato }}
          path: .

      - name: Montar o site
        # resumo enxuto pra abrir rapido + detalhes por estado sob demanda
        run: |
          python scripts/montar_site.py --saida _site
          du -sh _site _site/dados

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
