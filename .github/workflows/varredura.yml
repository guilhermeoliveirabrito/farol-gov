name: varredura semanal

on:
  schedule:
    # segunda-feira 06:17 UTC (03:17 em Brasilia)
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      amostra:
        description: "Varrer so N dominios aleatorios (vazio = todos)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e .

      - name: Atualizar lista de dominios
        run: python scripts/coletar_dominios.py -o data/dominios.csv

      - name: Varredura
        env:
          AMOSTRA: ${{ inputs.amostra }}
        run: |
          extra=""
          if [ -n "$AMOSTRA" ]; then extra="--amostra $AMOSTRA"; fi
          farol scan data/dominios.csv -o data/resultados/latest.json $extra
          cp data/resultados/latest.json "data/resultados/$(date -u +%Y-%m-%d).json"

      - name: Gerar resumo
        run: |
          farol resumo data/resultados/latest.json -o RESULTADOS.md --revisao data/revisar_wikidata.csv
          cat RESULTADOS.md
          cat RESULTADOS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: resultados
          path: |
            data/resultados/latest.json
            data/revisar_wikidata.csv
            RESULTADOS.md

      # rodada de teste (com amostra) nao vai pro repositorio
      - name: Commit dos resultados
        if: ${{ !inputs.amostra }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RESULTADOS.md
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "data: varredura de $(date -u +%Y-%m-%d)"
          git push

  # publica a pagina com o resultado desta rodada (inclusive amostra, que aparece com aviso)
  site:
    needs: varredura
    uses: ./.github/workflows/pages.yml
    with:
      artefato: resultados
    permissions:
      contents: read
      pages: write
      id-token: write
