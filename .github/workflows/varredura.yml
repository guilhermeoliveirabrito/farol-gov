name: varredura semanal

on:
  schedule:
    # segunda-feira 06:17 UTC (03:17 em Brasilia)
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      amostra:
        description: "Varrer so N dominios aleatorios (vazio = todos). Amostra nunca vai pro site."
        required: false
        default: ""
      forcar:
        description: "Publicar mesmo se a validacao reclamar (so se voce conferiu o resumo)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    # a varredura tem prazo interno de 75 min + 10 de repescagem; isso aqui e so a rede de seguranca
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e .

      - name: Atualizar lista de dominios
        run: python scripts/coletar_dominios.py -o data/dominios.csv

      - name: Varredura
        env:
          AMOSTRA: ${{ inputs.amostra }}
        run: |
          extra=""
          if [ -n "$AMOSTRA" ]; then extra="--amostra $AMOSTRA"; fi
          farol scan data/dominios.csv -o data/resultados/latest.json $extra

      - name: Gerar resumo
        run: |
          farol resumo data/resultados/latest.json -o RESULTADOS.md --revisao data/revisar_wikidata.csv --historico data/historico
          cat RESULTADOS.md
          cat RESULTADOS.md >> "$GITHUB_STEP_SUMMARY"

      # o artefato sobe mesmo se a validacao falhar, pra dar pra investigar
      - uses: actions/upload-artifact@v7
        with:
          name: resultados
          path: |
            data/resultados/latest.json
            data/revisar_wikidata.csv
            data/sem_site.csv
            RESULTADOS.md

      # rodada ruim (runner bloqueado, prazo estourado) para aqui: o site e o historico
      # continuam com a varredura anterior e o job fica vermelho com o motivo no resumo
      - name: Validar
        if: ${{ !inputs.amostra }}
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          set +e
          farol validar data/resultados/latest.json --historico data/historico > validacao.md
          status=$?
          cat validacao.md
          cat validacao.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$FORCAR" != "true" ]; then exit 1; fi

      # rodada de teste (com amostra) nao vai pro repositorio nem pro historico
      - name: Commit dos resultados
        if: ${{ !inputs.amostra }}
        run: |
          farol arquivar data/resultados/latest.json --pasta data/historico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RESULTADOS.md
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "data: varredura de $(date -u +%Y-%m-%d)"
          # a varredura leva quase uma hora e pode entrar commit de codigo no meio;
          # os dados so mexem em data/ e RESULTADOS.md, entao o rebase nao conflita
          for tentativa in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push recusado, tentando de novo ($tentativa)"
            sleep $((tentativa * 5))
          done
          exit 1

  # publica a pagina so com varredura completa e validada; amostra e so pra teste
  site:
    needs: varredura
    if: ${{ !inputs.amostra }}
    uses: ./.github/workflows/pages.yml
    with:
      artefato: resultados
    permissions:
      contents: read
      pages: write
      id-token: write
