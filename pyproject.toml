[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farol-gov"
version = "0.1.0"
description = "Observatório aberto da segurança dos sites e e-mails do governo brasileiro"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guilherme Oliveira de Brito Silva" }]
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
farol = "farol.cli:main"

[tool.setuptools.packages.find]
include = ["farol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
