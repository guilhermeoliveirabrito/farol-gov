[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farol-gov"
version = "0.1.0"
description = "Observatório aberto da segurança dos sites e e-mails do governo brasileiro"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guilherme Oliveira de Brito Silva" }]
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]
e2e = ["pytest>=8", "playwright>=1.50"]

[project.scripts]
farol = "farol.cli:main"

[tool.setuptools.packages.find]
include = ["farol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# erros reais, imports, modernizacao e alguns bugs comuns
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# SIM105: o try/except/pass deixa mais claro qual chamada pode falhar
# B905: zip com strict quebraria o build por causa de um snapshot antigo torto
ignore = ["E501", "SIM108", "SIM105", "B905"]
